name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Run the Node.js-based actions (checkout) on Node 24 now, instead of the
# deprecated Node 20 runtime (GitHub deprecation, June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin DAGGER_VERSION=v0.20.8 sh
          dagger version

      # Containerized vet + unit/integration suite. The Docker-based e2e
      # package is excluded here by design (it provisions a SiYuan container).
      - name: Vet & test (internal + cmd)
        run: dagger --silent call test
