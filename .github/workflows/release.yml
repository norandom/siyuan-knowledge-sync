name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0). Defaults to 'dev' for manual runs."
        required: false
        default: "dev"

permissions:
  contents: write

# Run the Node.js-based actions (checkout, gh-release) on Node 24 now,
# instead of the deprecated Node 20 runtime (GitHub deprecation, June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=${INPUT_VERSION:-dev}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin DAGGER_VERSION=v0.20.8 sh
          dagger version

      - name: Cross-compile release artifacts (linux amd64/arm64, darwin amd64/arm64)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: dagger --silent call release --version="$VERSION" export --path=./dist

      - name: List artifacts
        run: |
          ls -la ./dist
          cat ./dist/SHA256SUMS

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.v.outputs.version }}
          files: dist/*
          generate_release_notes: true
